name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx --no-install playwright-core install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Rendered-mobile browser smoke test
        run: npm run test:browser-smoke
        timeout-minutes: 1
        env:
          DEBUG: pw:browser

      - name: Build
        run: npm run build

      - name: Article and customer-path browser tests
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .next/content-review .next/customer-path
          server_pid=""
          cleanup() {
            trap - EXIT INT TERM
            if [[ -n "$server_pid" ]]; then
              kill -TERM -- "-$server_pid" 2>/dev/null || true
              for attempt in {1..20}; do
                if ! kill -0 -- "-$server_pid" 2>/dev/null; then break; fi
                sleep 0.25
              done
              kill -KILL -- "-$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          # Own a process group so cleanup also stops any server children.
          setsid node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3100 \
            > .next/content-review/server.log 2>&1 &
          server_pid=$!
          # At most 30 one-second requests plus 30 one-second waits.
          for attempt in {1..30}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat .next/content-review/server.log
              echo "Production server exited before readiness."
              exit 1
            fi
            if curl --fail --silent --max-time 1 http://127.0.0.1:3100/blog > /dev/null; then
              npm run test:resources-browser 2>&1 | tee .next/content-review/browser.log
              npm run test:customer-paths 2>&1 | tee .next/customer-path/browser.log
              exit 0
            fi
            sleep 1
          done
          cat .next/content-review/server.log
          echo "Production server did not become ready within 60 seconds."
          exit 1

      - name: Upload article browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .next/content-review/*.png
            .next/content-review/*.json
            .next/content-review/*.log
            .next/customer-path/*.png
            .next/customer-path/*.json
            .next/customer-path/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
