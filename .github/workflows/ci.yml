name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Inspect system browsers for rendered-mobile smoke test
        shell: bash
        run: |
          echo "Google Chrome executable:"
          which google-chrome || true
          google-chrome --version || true
          echo "Chromium executable:"
          which chromium || true
          chromium --version || true

          chromium_path="/usr/bin/chromium"
          if [[ ! -x "$chromium_path" ]]; then
            echo "The expected GitHub runner Chromium executable at $chromium_path is unavailable or not executable." >&2
            exit 1
          fi

          ls -l "$chromium_path"
          echo "Using $($chromium_path --version) at $chromium_path"
          echo "CI_RENDERED_MOBILE_CHROME_PATH=$chromium_path" >> "$GITHUB_ENV"

      - name: Rendered-mobile browser smoke test
        run: npm run test:browser-smoke
        timeout-minutes: 1
        env:
          DEBUG: pw:browser

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
