name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Locate system Chrome for rendered-mobile smoke test
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "$chrome_path" ]]; then
            echo "No system Chrome/Chromium executable is available on this runner." >&2
            exit 1
          fi
          echo "Using $($chrome_path --version) at $chrome_path"
          echo "WEBSITE_AUDIT_CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Rendered-mobile browser smoke test
        run: npm run test:browser-smoke
        timeout-minutes: 1

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
